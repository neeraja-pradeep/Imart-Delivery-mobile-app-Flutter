name: imart_delivery_app
description: "iMart Delivery Partner app — rider trip, pickup and delivery flow."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Responsiveness
  flutter_screenutil: ^5.9.3

  # UI
  flutter_svg: ^2.0.10+1

  # Utilities
  url_launcher: ^6.3.1
  # Play Store in-app updates (Android, Play installs only)
  in_app_update: ^4.2.3
  connectivity_plus: ^6.1.0
  pointer_interceptor: ^0.10.1

  # Networking (session cookie + CSRF auth)
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9

  # Secure storage (session cookies live in Keychain / Keystore)
  flutter_secure_storage: ^11.2.0

  # Live location while on a delivery (geolocator runs the Android
  # "location" foreground service; permission_handler covers the battery
  # optimisation exemption and the notification permission)
  geolocator: ^14.1.2
  permission_handler: ^12.0.1

  # In-app map: OpenStreetMap during development (no key). Switch
  # TripMapView to google_maps_flutter before release.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: ImartPoppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # The design loads Roboto 300/400/500/700 only. Browsers resolve a
    # requested weight of 600 to the 700 face, so 600 maps to Bold here too.
    - family: ImartRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: ImartSora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
